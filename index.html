<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Dark-only site: native controls and the overscroll canvas stay dark -->
  <meta name="color-scheme" content="dark" />
  <title>Salome Mosiava — Art Director &amp; Senior Product Designer</title>
  <meta name="description" content="Salome Mosiava — Art Director &amp; Senior Product Designer. Visual identity, design systems, and brand design for 80+ companies worldwide." />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/dgfn598qb/image/upload/v1777840530/fav_ggorfv.png" />

  <!-- Images come from Cloudinary. Plain <img> requests are not CORS, so the
       preconnect must not be either, or the browser cannot reuse it.
       Fonts are self-hosted (src/styles/fonts.css). -->
  <link rel="preconnect" href="https://res.cloudinary.com" />

  <!-- Fallback Open Graph (overridden by React Helmet per page) -->
  <meta property="og:title" content="Salome Mosiava — Art Director & Senior Product Designer" />
  <meta property="og:description" content="Visual identity, design systems, and brand design for 80+ companies worldwide." />
  <meta property="og:image" content="https://samole.ge/hero-screenshot.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://samole.ge/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Salome Mosiava" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Salome Mosiava — Art Director & Senior Product Designer" />
  <meta name="twitter:description" content="Visual identity, design systems, and brand design for 80+ companies worldwide." />
  <meta name="twitter:image" content="https://samole.ge/hero-screenshot.jpg" />

  <!-- Fallback canonical (overridden by React Helmet per page) -->
  <link rel="canonical" href="https://samole.ge/" />

  <!-- Sitemap -->
  <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

  <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
